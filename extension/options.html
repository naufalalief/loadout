<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Courier — Extension Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&display=swap">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">
    <div class="margin"></div>
    <div class="body">
      <div class="letterhead"><span class="serif">Courier</span> — browser companion</div>

      <div class="status-inline"><span class="dot" id="status-dot"></span><span id="status">Checking…</span></div>
      <div class="statussub">Things you download, or fetch from a video page, are sent here automatically. If it stops connecting, these still work:</div>

      <div class="section">Pairing</div>
      <div class="fields">
        <div class="field">
          <div class="flabel">This profile</div>
          <button type="button" class="fval" id="pair-btn" disabled>Pair manually</button>
        </div>
        <div class="field">
          <div class="flabel">If something's stuck</div>
          <button type="button" class="fval danger" id="forget-btn">Forget pairing</button>
        </div>
      </div>
      <p id="pair-error" class="error"></p>
      <p id="forget-status" class="shint"></p>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
