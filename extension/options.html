      <div>
        <div class="htitle">Loadout</div>
        <div class="htag">Browser Companion</div>
      </div>
    </div>

    <div class="card">
      <div class="statusrow">
        <div class="statusdot" id="status-dot"></div>
        <div class="statustext" id="status">Checking...</div>
      </div>
    </div>

    <div class="card">
      <div class="note">
        Pairing happens automatically the first time you download or extract
        something. If it hasn't connected, or this extension was moved or
        reinstalled and the app still thinks the old install is paired, use
        these:
      </div>
      <div class="actrow">
        <button id="pair-btn" class="pairbtn2" type="button" disabled>Pair manually</button>
        <button id="forget-btn" class="forgetbtn" type="button">Forget pairing</button>
      </div>
      <p id="pair-error" class="msg error"></p>
      <p id="forget-status" class="msg"></p>
    </div>

  <script src="options.js"></script>
